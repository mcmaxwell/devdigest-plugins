name: Site

# Two jobs, shown separately from the "Validate" workflow so a site failure is
# never confused with a marketplace validation failure.
# - "Build site": on every pull request and every push to main. Builds the
#   catalogue and the static site and keeps the result as an artifact.
# - "Deploy to GitHub Pages": on push to main only, or when dispatched by hand
#   (scripts/rollback.mjs --site <ref> tags a known-good commit and dispatches
#   this workflow on the tag).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci
      - name: Build catalogue
        run: npm run catalog
        env:
          SITE_BASE_URL: https://mcmaxwell.github.io/devdigest-plugins
      - name: Type check
        run: npm run check
      - name: Build site
        run: npm run build
        env:
          SITE_BASE_URL: https://mcmaxwell.github.io/devdigest-plugins
      - name: Catalogue summary
        run: node -e "const c=require('./public/catalog.json');console.log(c.records.length+' records from '+c.commit.slice(0,7))"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
